[project]
name = "Property-Valuation"
version = "0.1.0"
description = "Single-page app estimating a house price from 63 features, by four interchangeable methods"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn==1.9.1",
    "xgboost>=3.4.1",
    "joblib>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    ".git",
    "__pycache__"
]
